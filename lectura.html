<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Lectura del municipio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Lectura del municipio: un párrafo con notas numeradas y sus fuentes; debajo, en la versión privada,
   la guía de mensaje en cuatro bloques. Se imprime en A4 para el PDF. Marca CivisLab: Montserrat en todo. */
:root{
  --papel:#F4F5F2; --superficie:#FFFFFF; --superficie-2:#EEF1EC; --linea:#D8DED6; --linea-2:#BFC9BE;
  --tinta:#1D2422; --tinta-2:#4C5752; --tinta-3:#65706B; --acento:#2B4B48; --acento-tinta:#FFFFFF; --salvia:#96B483;
  --aviso:#7E5F14; --aviso-fondo:#F6EDD6; --ok:#2B4B48; --ok-fondo:#E2EBE0; --rojo:#9B3B26;
  --f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0F1716; --superficie:#16201E; --superficie-2:#1C2826; --linea:#2A3935; --linea-2:#3A4C47;
    --tinta:#E8EEEA; --tinta-2:#B5C2BC; --tinta-3:#93A29B; --acento:#A9C98F; --acento-tinta:#10201D; --salvia:#7FA36E;
    --aviso:#E4BC6A; --aviso-fondo:#2C2415; --ok:#A9C98F; --ok-fondo:#1F2E25; --rojo:#E8957E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#0F1716; --superficie:#16201E; --superficie-2:#1C2826; --linea:#2A3935; --linea-2:#3A4C47;
  --tinta:#E8EEEA; --tinta-2:#B5C2BC; --tinta-3:#93A29B; --acento:#A9C98F; --acento-tinta:#10201D; --salvia:#7FA36E;
  --aviso:#E4BC6A; --aviso-fondo:#2C2415; --ok:#A9C98F; --ok-fondo:#1F2E25; --rojo:#E8957E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:16px}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.pagina{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.02em;display:inline-flex;align-items:center;color:var(--tinta);text-decoration:none}
.marca .barra{display:inline-block;width:.19em;height:.81em;background:var(--salvia,#96B483);margin:0 .1em;border-radius:0;transform:translateY(1px)}
.marca .lab{color:var(--acento);margin-left:.28em}
.ante{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);margin:18px 0 6px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(22px,3vw,28px);line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0 0 10px}
.entrada{max-width:72ch;color:var(--tinta-2);margin:0}
.munis{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 18px}
.munis button{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;min-height:40px;border-radius:999px;border:1px solid var(--linea-2);background:var(--superficie);color:var(--tinta);cursor:pointer;transition:background-color .15s,border-color .15s}
.munis button:hover{border-color:var(--acento)}
.munis button[aria-pressed="true"]{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.caja{background:var(--superficie);border:1px solid var(--linea);border-radius:16px;padding:clamp(18px,3vw,32px)}
.cab{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.nombre{display:grid;gap:8px;justify-items:start}
.estado{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
.estado.borrador{background:var(--aviso-fondo);color:var(--aviso)}
.estado.revisada{background:var(--ok-fondo);color:var(--ok)}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.boton{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:999px;background:var(--acento);color:var(--acento-tinta);font-weight:600;font-size:14.5px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.boton svg{width:18px;height:18px}
.lectura{font-size:clamp(17px,1.6vw,18.5px);line-height:1.72;max-width:68ch;margin:0}
.lectura sup{line-height:0;font-size:.68em;font-weight:700;margin-left:1px}
.lectura sup a{color:var(--acento);text-decoration:none;padding:0 1px}
.lectura sup a:hover{text-decoration:underline}
.fuentes{margin:22px 0 0;padding:16px 0 0 22px;border-top:1px solid var(--linea);font-size:13.5px;color:var(--tinta-2);display:grid;gap:6px;max-width:90ch}
.fuentes li:target{background:var(--aviso-fondo);border-radius:6px}
.fuentes a{color:var(--acento);overflow-wrap:anywhere}
.fuentes .url{display:none}
.aviso{font-size:13px;color:var(--tinta-3);margin:14px 0 0;max-width:90ch}
.guia{margin-top:22px}
.guia .cab h2 span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--aviso);display:block;margin-bottom:4px}
.bloques{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bloque{background:var(--superficie-2);border-radius:12px;padding:16px}
.bloque.ancho{grid-column:1/-1}
.bloque ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:15px;line-height:1.55}
.bloque li::marker{color:var(--tinta-3)}
.bloque sup{font-size:.7em;font-weight:700}
.bloque sup a{color:var(--acento);text-decoration:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-right:4px}
.tag.rezago{color:var(--rojo)} .tag.fortaleza{color:var(--ok)} .tag.contratacion{color:var(--tinta-3)}
footer{margin-top:34px;font-size:13px;color:var(--tinta-3);max-width:90ch}
@media screen and (max-width:760px){.bloques{grid-template-columns:minmax(0,1fr)}}
/* PDF: una página A4 por municipio, sin controles, con las direcciones de las fuentes */
@page{size:A4;margin:16mm 15mm}
@media print{
  :root{--papel:#fff;--superficie:#fff;--superficie-2:#F3F5F2}
  body{font-size:11pt;background:#fff;color:#111}
  .pagina{padding:0;max-width:none}
  .munis,.acciones,.no-pdf,#volver-civislab{display:none!important}
  .caja{border:0;padding:0;border-radius:0}
  .lectura{font-size:11.5pt;line-height:1.6;max-width:none}
  .fuentes{font-size:8.5pt;margin-top:10pt;padding-top:8pt;gap:3pt}
  .aviso,footer{font-size:8pt;margin-top:6pt}
  .fuentes .url{display:inline!important;color:#555;word-break:break-all}
  .guia{break-before:page}
  .bloque li{break-inside:avoid}
  .bloques{grid-template-columns:1fr 1fr;gap:8pt}
  .bloque ul{font-size:9.5pt}
}
</style>

  <h1 id="titulo">Lectura del municipio</h1>

  <section class="caja guia" id="guia" hidden></section>
  <footer id="pie"></footer>
</div>

":3,"texto":"CivisLab, mapa de veletas: cruce puesto a puesto de la alcaldía 2023 con la segunda vuelta 2026","url":null},{"n":4,"texto":"TerriData (DNP) · DNP, con datos de MinDefensa y DANE: Tasa de homicidios en accidentes de tránsito por cada 100.000 habitantes (2025)","url":"https://terridata.dnp.gov.co/assets/docs/txt/dimensiones/TerriData_Dim6.txt.zip"},{"n":5,"texto":"TerriData (DNP) · Ministerio de Tecnologías de la Información y las Comunicaciones: Penetración de acceso fijo a Internet (2025)","url":"https://terridata.dnp.gov.co/assets/docs/txt/dimensiones/TerriData_Dim3.txt.zip"},{"n":6,"texto":"MinEducación · MEN_ESTADISTICAS_EN_EDUCACION_EN_PREESCOLAR, BÁSICA Y MEDIA_POR_MUNICIPIO: Tasa de reprobación (transición a media) (2024)","url":"https://www.datos.gov.co/resource/nudc-7mev.json?%24select=a_o%2Cc_digo_municipio%2Cmunicipio%2Ccobertura_neta%2Ccobertura_neta_media%2Cdeserci_n%2Creprobaci_n&%24where=a_o%20%3E%3D%20%272015%27&%24order=c_digo_municipio%2Ca_o&%24limit=50000"}],"n_lectura":6,"revisada":true,"por":"Carlos Calle Galvis","fecha":"2026-10-22","pdf":"pdf/lectura-barbosa.pdf"}],"aviso":"Lectura exploratoria: describe resultados y cifras oficiales del municipio, no explica sus causas ni pronostica 2027. Todos los porcentajes de votos son sobre votos válidos (candidatos y voto en blanco), como los reporta la Registraduría.","aviso_guia":"Orientación con datos, no una encuesta: dice dónde mirar y qué tiene respaldo, no qué le importa a cada barrio. Ningún dato es de personas; todo es por puesto de votación, comuna o municipio.","pie":"CivisLab · versión interna. Para corregir un dato: info.civislab@gmail.com"}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("datos").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.hash.slice(1));
const PDF = params.get("pdf") === "1";
let cod = params.get("m") && D.munis.some(m => m.cod === params.get("m")) ? params.get("m") : D.munis[0].cod;
const ICONO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

const munisEl = document.getElementById("munis");
munisEl.innerHTML = D.munis.map(m => `<button type="button" data-cod="${m.cod}" aria-pressed="false">${esc(m.n)}</button>`).join("");
munisEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { cod = b.dataset.cod; pintar(); } });
if (PDF) munisEl.hidden = true;

// notas: superíndice enlazado a la fuente de la lista, que queda justo debajo del párrafo
const sup = ns => ns.map(n => `<sup><a href="#f${n}" aria-label="Fuente ${n}">${n}</a></sup>`).join("");

// en el PDF la dirección va escrita, recortada a dominio y comienzo de la ruta
const corta = u => { try { const x = new URL(u), r = x.hostname + x.pathname; return r.length > 70 ? r.slice(0, 69) + "…" : r; } catch (e) { return u; } };
const lista = (fs, desde) => fs.length ? `<ol class="fuentes" start="${desde}" aria-label="Fuentes">${fs.map(f => `<li id="f${f.n}">${f.url
  ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.texto)}</a><span class="url"> — ${esc(corta(f.url))}</span>` : esc(f.texto)}</li>`).join("")}</ol>` : "";

function pintar(){
  const m = D.munis.find(x => x.cod === cod);
  munisEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cod === cod)));
  document.title = `Lectura de ${m.n} · CivisLab`;
  const estado = m.revisada ? `<span class="estado revisada">Revisada por ${esc(m.por)} · ${esc(m.fecha)}</span>`
    : `<span class="estado borrador">Borrador sin revisión de analista</span>`;
  const pdf = m.pdf ? `<a class="boton" id="pdf" href="${esc(m.pdf)}" target="_blank" rel="noopener">${ICONO}Descargar PDF</a>` : "";
  document.getElementById("art").innerHTML = `<div class="cab"><div class="nombre"><h2>${esc(m.n)}</h2>${estado}</div><div class="acciones">${pdf}</div></div>
    <p class="lectura">${m.lectura.map(f => esc(f.t) + sup(f.n)).join(" ")}</p>
    ${lista(m.fuentes.slice(0, m.n_lectura), 1)}
    <p class="aviso">${esc(D.aviso)}</p>`;
  const g = document.getElementById("guia");
  if (!m.guia) { g.hidden = true; return; }
  g.hidden = false;
  const blq = (titulo, xs) => `<div class="bloque"><h3>${titulo}</h3><ul>${xs.map(x => `<li>${x.tipo ? `<span class="tag ${x.tipo}">${esc({rezago: "Rezago", fortaleza: "Fortaleza", contratacion: "Contratación"}[x.tipo])}</span>` : ""}${esc(x.tipo ? x.t.replace(/^(Rezago|Fortaleza): /, "") : x.t)}${sup(x.n)}</li>`).join("")}</ul></div>`;
  g.innerHTML = `<div class="cab"><h2><span>Personalizado · uso interno</span>Guía de mensaje para ${esc(m.n)}</h2></div>
    <div class="bloques">${blq("Dónde", m.guia.donde)}${blq("Qué tiene dato", m.guia.dato)}${blq("Qué evitar", m.guia.evitar)}${blq("Qué falta", m.guia.falta)}
    ${m.guia.ecv ? blq("Dónde duele más, por comuna (Encuesta de Calidad de Vida 2024–2025)", m.guia.ecv).replace('class="bloque"', 'class="bloque ancho"') : ""}</div>
    ${lista(m.fuentes.slice(m.n_lectura), m.n_lectura + 1)}
    <p class="aviso">${esc(D.aviso_guia)}</p>`;
}
document.getElementById("pie").textContent = D.pie;
// PDF: en el visor de Claude un enlace no descarga; si el visor ofrece «downloads», se entrega el archivo con su confirmación.
// Fuera del visor (GitHub Pages) el enlace abre el PDF en otra pestaña.
let descargas = null;
(async () => { try { descargas = await window.claude?.use?.("downloads") || null; } catch (e) { descargas = null; } })();
document.getElementById("art").addEventListener("click", async e => {
  const a = e.target.closest("#pdf");
  if (!a || !descargas) return;
  e.preventDefault();
  try {
    const blob = await (await fetch(a.getAttribute("href"))).blob();
    await descargas.save({filename: a.getAttribute("href").split("/").pop(), data: blob});
  } catch (err) {
    if (!err || err.code !== "declined") a.insertAdjacentHTML("afterend", `<p class="aviso" role="status">No se pudo descargar aquí. Abra el link público o pídame el PDF por chat.</p>`);
  }
});
pintar();
})();
</script>
